[package]
name = "compiler"
version = "0.9.3"
edition = "2024"

[[bin]]
name = "tinyfx"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive"] }
include_dir = "0.7"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9.8"

tokio       = { version = "1", features = ["full"] }
hyper       = { version = "1", features = ["http1", "server"] }
hyper-util  = { version = "0.1", features = ["tokio"] }
bytes        = "1"
http-body-util = "0.1"
mime_guess  = "2"
notify      = "8.2"          # file watching
tokio-tungstenite = "0.28" # websockets for live reload
futures-util = "0.3"